runtime: python314

# Required by App Engine's `login: admin` handlers.
app_engine_apis: true

entrypoint: gunicorn -b :$PORT -w 2 main:app

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.75

default_expiration: "7d"

env_variables:
  REVIEW_BUCKET: "bhangraboard-prod.appspot.com"
  REVIEW_PREFIX: "audio-review/reviews"

handlers:
  # AudioLab media must be declared before the public /static handler.
  - url: /static/review-audio
    static_dir: static/review-audio
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect
    expiration: "0s"

  - url: /audio-review/api/.*
    script: auto
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: unauthorized

  - url: /audio-review.*
    script: auto
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect

  - url: /admin.*
    script: auto
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect

  # The soundboard and its ordinary assets are intentionally public in prod.
  - url: /static
    static_dir: static
    secure: always
    redirect_http_response_code: 301

  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301
