runtime: python314

# Required by `login: admin`. This broader compatibility flag is used because
# older gcloud schema bundles do not yet recognize app_engine_bundled_services.
app_engine_apis: true

entrypoint: gunicorn -b :$PORT -w 2 main:app

instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.75

default_expiration: "7d"

env_variables:
  REVIEW_BUCKET: "bhangraboard-dev.appspot.com"
  REVIEW_PREFIX: "audio-review/reviews"

handlers:
  - url: /static/review-audio
    static_dir: static/review-audio
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect
    expiration: "0s"

  - url: /audio-review/api/.*
    script: auto
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: unauthorized

  - url: /audio-review.*
    script: auto
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect

  - url: /static
    static_dir: static
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect

  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301
    login: admin
    auth_fail_action: redirect
